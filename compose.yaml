services:
  clinicflow-web:
    build: ./app/web
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - clinicflow-api
    environment:
      API_URL: http://clinicflow-api:5000
      LOCAL_STAFF_ACCESS: "1"
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:mode=1777

  clinicflow-api:
    image: clinicflow-api:test
    build:
      context: .
      dockerfile: app/api/Dockerfile
    depends_on:
      clinicflow-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5001:5000"
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:mode=1777
    environment:
      DB_HOST: clinicflow-db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}

  
  clinicflow-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
