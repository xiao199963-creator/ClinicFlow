<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClinicFlow - Book an appointment</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #1f2937; }
    h1 { font-size: 22px; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input, select { width: 100%; padding: 8px; font-size: 16px; box-sizing: border-box; }
    .slots { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .slots button { padding: 8px 12px; border: 1px solid #94a3b8; background: #fff; border-radius: 6px; cursor: pointer; }
    .slots button.selected { background: #0f766e; color: #fff; border-color: #0f766e; }
    .slots button:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }
    #submit { margin-top: 20px; padding: 10px 18px; font-size: 16px; background: #0f766e; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    #msg { margin-top: 16px; font-weight: 600; }
    nav a { font-size: 14px; }
  </style>
</head>
<body>
  <nav><a href="schedule.html">Staff schedule</a></nav>
  <h1>Book an appointment</h1>
  <label for="clinic">Clinic</label>
  <select id="clinic"></select>
  <label for="date">Date</label>
  <input id="date" type="date">
  <label>Time</label>
  <div id="slots" class="slots"></div>
  <label for="name">Your name</label>
  <input id="name" type="text" autocomplete="name">
  <label for="mobile">Mobile number</label>
  <input id="mobile" type="tel" autocomplete="tel">
  <button id="submit">Book</button>
  <div id="msg"></div>
  <script>
    const clinicEl = document.getElementById('clinic');
    const dateEl = document.getElementById('date');
    const slotsEl = document.getElementById('slots');
    const msgEl = document.getElementById('msg');
    let selectedHour = null;

    function pad(h) { return String(h).padStart(2, '0') + ':00'; }

    async function loadClinics() {
      const res = await fetch('/api/clinics');
      const clinics = await res.json();
      clinicEl.innerHTML = clinics.map(c => `<option value="${c.id}">${c.name} (${c.suburb})</option>`).join('');
    }

    async function loadSlots() {
      selectedHour = null;
      slotsEl.innerHTML = '';
      if (!clinicEl.value || !dateEl.value) return;
      const res = await fetch(`/api/slots?clinic_id=${clinicEl.value}&date=${dateEl.value}`);
      const slots = await res.json();
      slots.forEach(s => {
        const b = document.createElement('button');
        b.textContent = pad(s.hour);
        b.disabled = !s.available;
        b.onclick = () => {
          selectedHour = s.hour;
          [...slotsEl.children].forEach(x => x.classList.remove('selected'));
          b.classList.add('selected');
        };
        slotsEl.appendChild(b);
      });
    }

    document.getElementById('submit').onclick = async () => {
      msgEl.textContent = '';
      const body = {
        clinic_id: Number(clinicEl.value),
        slot_date: dateEl.value,
        slot_hour: selectedHour,
        patient_name: document.getElementById('name').value,
        mobile: document.getElementById('mobile').value
      };
      const res = await fetch('/api/bookings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      msgEl.textContent = res.ok ? `Booked. Your booking number is ${data.id}.` : `Could not book: ${data.error}`;
      if (res.ok) loadSlots();
    };

    clinicEl.onchange = loadSlots;
    dateEl.onchange = loadSlots;
    dateEl.value = new Date().toISOString().slice(0, 10);
    loadClinics().then(loadSlots);
  </script>
</body>
</html>
