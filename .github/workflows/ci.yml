name: ClinicFlow CI
on:
    pull_request:
    push:
        branches:
            - main  

jobs:
    docker-build:
        runs-on: ubuntu-latest

        env:
            MYSQL_DATABASE: clinicflow
            MYSQL_USER: clinicflow_user

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Generate passwords for the disposable Compose database
              shell: bash
              run: |
                for name in MYSQL_ROOT_PASSWORD MYSQL_PASSWORD; do
                  value=$(openssl rand -hex 32)
                  echo "::add-mask::$value"
                  echo "$name=$value" >> "$GITHUB_ENV"
                done
    
            - name: Build Docker Image
              uses: ./.github/actions/docker-build
              with:
                  image-name: clinicflow-api:test
                  build-context: .
            
            - name: Validate Docker Compose
              run: docker compose config --quiet

            - name: Start Containers
              run: |
                docker compose build clinicflow-web
                docker compose up -d --no-build

            - name: Test API Health
              run: |
                for i in {1..10}; do
                  if docker compose exec -T clinicflow-api python -c \
                    "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=10)"; then
                    echo "API is healthy"
                    exit 0
                  fi

                  echo "Health check failed, retrying..."
                  sleep 3
                done


                docker compose logs --no-color --tail=50
                exit 1


    terraform-validate:
        name: Terraform Validate
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: "1.16.1"

            - name: Terraform Format Check
              run: terraform fmt -check -recursive terraform

            - name: Terraform Init and Validate
              run: |
                  for root in environments/dev environments/staging environments/prod bootstrap/state bootstrap/platform bootstrap/budget; do
                    echo "Validating $root..."
                    terraform -chdir=terraform/$root init -backend=false
                    terraform -chdir=terraform/$root validate
                  done
