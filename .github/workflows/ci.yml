name: ClinicFlow CI
on:
    pull_request:
    push:
        branches:
            - main  

jobs:
    docker-build:
        runs-on: ubuntu-latest

        env:
            MYSQL_ROOT_PASSWORD: ci-root-password
            MYSQL_DATABASE: clinicflow
            MYSQL_USER: clinicflow_user
            MYSQL_PASSWORD: ci-password-password

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
    
            - name: Build Docker Image
              uses: ./.github/actions/docker-build
              with:
                  image-name: clinicflow-api:test
                  build-context: ./app/api
            
            - name: Validate Docker Compose
              run: docker compose config --quiet

            - name: Start Containers
              run: docker compose up -d --no-build

            - name: Test API Health
              run: |
                for i in {1..10}; do
                  if docker compose exec -T clinicflow-api python -c \
                    "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=10)"; then
                    echo "API is healthy"
                    exit 0
                  fi

                  echo "Health check failed, retrying..."
                  sleep 3
                done


                docker compose logs --no-color --tail=50
                exit 1