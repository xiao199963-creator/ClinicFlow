name: Build ClinicFlow Docker Image
description: Build the Flask API image

inputs:
  image-name:
    description: Docker image name and tag
    required: true

  build-context:
    description: Docker build context path
    required: true

  dockerfile:
    description: Dockerfile path
    default: app/api/Dockerfile

runs:
  using: composite
  steps:
    - name: Build Docker image
      shell: bash

      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        BUILD_CONTEXT: ${{ inputs.build-context }}
      run: docker build --platform linux/amd64 -f "$DOCKERFILE" -t "$IMAGE_NAME" "$BUILD_CONTEXT"



     